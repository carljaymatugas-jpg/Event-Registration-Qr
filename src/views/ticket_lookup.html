{% extends "base.html" %}
{% block title %}Find Your Ticket — EventReg{% endblock %}
{% block content %}
<div class="form-container">
  <h1>Find Your Ticket</h1>
  <p>Enter your ticket code and email (or mobile number) to retrieve your ticket.</p>

  {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/lookup">
    <div class="field">
      <label for="ticket_code">Ticket Code *</label>
      <input type="text" id="ticket_code" name="ticket_code" placeholder="e.g. CDM-7K3P9Q-A3F2"
             style="text-transform:uppercase" required autocomplete="off">
    </div>
    <div class="field">
      <label for="identifier">Email or Mobile Number *</label>
      <input type="text" id="identifier" name="identifier" placeholder="juan@example.com or 09171234567" required autocomplete="username">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Find Ticket</button>
  </form>
</div>
{% endblock %}
