services:
  - type: web
    name: eventreg
    env: node
    plan: free
    buildCommand: npm install && node src/db/seed.js
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_HMAC_SECRET
        generateValue: true
